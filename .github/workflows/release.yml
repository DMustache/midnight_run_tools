name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package binaries
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $binaries = @(
            "boot_breaker",
            "blimp_jump",
            "automation_attack"
          )

          foreach ($binary in $binaries) {
            $exe = "target/release/$binary.exe"
            $zip = "$dist/$binary-windows-x86_64.zip"

            if (!(Test-Path $exe)) {
              throw "Missing release binary: $exe"
            }

            Compress-Archive -Path $exe -DestinationPath $zip -Force
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName }

          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME $assets --clobber
          } else {
            gh release create $env:TAG_NAME `
              --title $env:TAG_NAME `
              --notes "Release $env:TAG_NAME" `
              $assets
          }
